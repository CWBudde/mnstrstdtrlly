name: Deploy to GitHub Pages

# Prüft Builds auf main, dem Entwicklungsbranch und Pull Requests.
# Veröffentlicht technisch geprüfte main-Builds als Entwurf auf dem gh-pages-Branch.
# In Settings → Pages einmalig „Deploy from a branch“, gh-pages / root auswählen.

on:
  push:
    branches: [main, 'claude/munster-city-rally-r2i9xd']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Feldfreigabe für die Entwurfsveröffentlichung prüfen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if npm run verify:release; then
            echo '### Feldfreigabe: Nachweise vollständig' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::Feldfreigabe fehlt. Die App wird als ungeprüfter Entwurf veröffentlicht.'
            echo '### Feldfreigabe ausstehend: Veröffentlichung als Entwurf' >> "$GITHUB_STEP_SUMMARY"
            echo 'Begehungen und unabhängiger Blindtest müssen vor dem regulären Einsatz nachgeholt werden.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: touch dist/.nojekyll
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
